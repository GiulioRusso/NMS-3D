[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nms_3d"
dynamic = ["version"]
description = "Minimal torch-only 3D bounding box non-maximum suppression (NMS), with optional Plotly plotting"
readme = { file = "README.md", content-type = "text/markdown" }

authors = [
    { name = "Giulio Russo", email = "russogiulio1998@icloud.com" },
    { name = "Ciro Russo", email = "ciro.russo2910@gmail.com" }
]

license = { text = "MIT License" }

requires-python = ">=3.9.5"

dependencies = [
    "torch>=2.2.2",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
plot = ["plotly>=5.13.1"]
# torchvision/monai are test oracles: tests that need them skip when missing
dev = ["pytest>=7", "torchvision", "monai>=1.0"]

[project.urls]
Homepage = "https://github.com/GiulioRusso/NMS-3D"

[tool.setuptools.packages.find]
include = ["nms_3d*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "nms_3d._version.__version__" }
[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
